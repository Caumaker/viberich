<style>

.tabela{overflow-x:auto;margin:4px 0;border:1px solid var(--bd);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:15px}th{white-space:nowrap;background:#f3f2ee;text-align:left;font-weight:600;color:#39424b;padding:9px 12px;border-bottom:1px solid var(--bd)}td{overflow-wrap:normal;word-break:normal;hyphens:manual;padding:9px 12px;border-bottom:1px solid #efede8;vertical-align:top}tbody tr:last-child td{border-bottom:0}td:first-child{min-width:110px}

mark.sel{background:#ffe08a;border-radius:2px;cursor:pointer}

.conversa{display:flex;flex-direction:column;gap:6px;margin-top:4px}.msg{max-width:84%;padding:7px 10px 5px;border-radius:12px;font-size:14px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06)}.msg.dono{align-self:flex-end;background:#d9fdd3;border-bottom-right-radius:4px}.msg.cl{align-self:flex-start;background:#f1f3f5;border-bottom-left-radius:4px}.msg.ed{align-self:flex-start;background:#e7f1fb;border-left:3px solid var(--ag);border-bottom-left-radius:4px}.msg .quem{font-size:11.5px;font-weight:600;color:var(--ag);margin-bottom:2px}.msg .hora{display:block;text-align:right;margin:2px 0 0;font-size:10.5px;color:#8a949c}.msg img.anx{display:block;max-width:100%;max-height:180px;border-radius:8px;margin:4px 0;cursor:zoom-in}.msg{position:relative}.btnCitar{position:absolute;top:4px;right:-30px;opacity:0;border:1px solid var(--bd);background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;color:var(--mu);line-height:20px}.msg.dono .btnCitar{right:auto;left:-30px}.msg:hover .btnCitar{opacity:1}.citado{display:flex;flex-direction:column;background:rgba(0,0,0,.05);border-left:3px solid var(--ag);border-radius:6px;padding:4px 8px;margin:2px 0 5px;font-size:12px;cursor:pointer}.msg.dono .citado{border-left-color:#25a35a}.citado b{font-size:11.5px;color:var(--ag)}.citado span{color:#4a5560}.citando{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}.citando .citado{flex:1;margin:0}.citando button{border:0;background:none;font-size:18px;color:var(--mu);cursor:pointer}.msg.pisca{animation:pisca 1.6s ease}.conversa{padding:0 30px}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.prev img{height:56px;border-radius:6px;border:1px solid var(--bd)}.msg .q{white-space:pre-wrap;overflow-wrap:break-word}.msg .q code{background:rgba(0,0,0,.07);border-radius:4px;padding:0 4px;font-size:12.5px}.msg .q table.mt{border-collapse:collapse;margin:4px 0;font-size:12.5px;white-space:normal}.msg .q table.mt th,.msg .q table.mt td{border:1px solid rgba(0,0,0,.15);padding:2px 6px;text-align:left}.hora{color:#9aa3ab;font-size:11.5px;margin-left:6px}
.estado{font-size:11.5px;color:#9a6b00;margin-top:6px}
textarea{width:100%;min-height:74px;border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;font-size:14px;resize:vertical}

#abrePasta{position:fixed;top:14px;right:600px;z-index:30;border:1px solid #d6e2ef;border-radius:10px;padding:7px 14px;font:600 13.5px Inter;background:#fff;color:var(--ag);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);display:none}@media(max-width:1100px){#abrePasta{right:136px}}

.vazio{color:var(--mu);font-size:13.5px;background:#fff;border:1px dashed var(--bd);border-radius:12px;padding:14px;line-height:1.5}
.editor textarea{min-height:140px;font:13.5px/1.5 ui-monospace,Menlo,monospace}
#modal{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
#modal .cx{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:24px 28px}
.versao{border-top:1px solid var(--bd);padding:14px 0}.versao .cab{font-size:13px;color:var(--mu);margin-bottom:6px}.versao .cab b{color:var(--tx)}
ins{background:#d9f2e2;text-decoration:none}del{background:#fbe0dc;color:#8a2c1c}
.lk{display:inline-block;vertical-align:bottom;background:#eef3f9;border:1px solid #d6e2ef;color:var(--ag);border-radius:6px;padding:0 6px;font-size:12.5px;font-weight:600;cursor:copy;white-space:nowrap;max-width:calc(100% - 4px);overflow:hidden;text-overflow:ellipsis;line-height:1.5;margin:1px 0}.lk:hover{background:#e2ecf7}.lk.ok{background:#d9f2e2;border-color:#9fd3b2;color:var(--ok)}.lk.ok:after{content:' copiado'}.lk .abrir{text-decoration:none;color:var(--mu);font-weight:400;padding-left:2px}.lk .abrir:hover{color:var(--ag)}
.vivo{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}.vivo.on{background:var(--ok)}

.cartao{position:relative;border:1px solid var(--bd);border-radius:14px;padding:16px 20px 10px;margin:10px -8px 24px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(20,30,40,.06)}
.cartao .blk{margin:0 -12px 8px}.cartao h3{margin-top:2px}
.cartao.resp{border-color:#b9dcc6}
.cartao .selo{position:absolute;right:16px;top:-11px;font:600 11.5px/1.6 Inter;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:0 10px;color:var(--mu)}
.cartao.resp .selo{color:var(--ok);border-color:#b9dcc6}
.escolhas{display:flex;flex-direction:column;gap:7px;margin:6px 0 2px}
.op{position:relative;display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;background:#fcfcfa;transition:background .15s,border-color .15s;user-select:none;line-height:1.5}
.op:hover{background:#f5f8fc;border-color:#c9d9ea}
.op input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--ag);flex:none;cursor:pointer}
.op:has(input:checked){background:#eef5fc;border-color:var(--ag)}
.op:focus-within{outline:2px solid var(--ag);outline-offset:2px}
.op .tx{flex:1}
.op-switch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.sw{flex:none;width:36px;height:20px;border-radius:20px;background:#cfd5db;position:relative;margin-top:2px;transition:background .15s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.op-switch input:checked+.sw{background:var(--ag)}.op-switch input:checked+.sw:after{left:18px}
#doc{outline:none;caret-color:var(--ag)}
.blk.cur{background:#f8f6ef}
.fio:focus{outline:2px solid var(--ag);outline-offset:2px}
.lat-tit .tec{border:0;background:none;color:var(--ag);font:600 12.5px Inter;cursor:pointer;padding:0 0 0 8px}
.teclas td{padding:5px 10px;border-bottom:1px solid #efede8;font-size:14px}.teclas kbd{display:inline-block;border:1px solid #cfd5db;border-bottom-width:2px;border-radius:6px;padding:0 6px;font:600 12px ui-monospace,Menlo,monospace;background:#f8f9fa;margin:1px 2px}
</style></head><body>
<div class="layout"><main class="papel"><div id="doc"></div></main>
<aside class="lateral"><div class="lat-tit"><span><span class="vivo" id="vivo"></span><span id="cont">Comentários</span><button class="tec" onclick="atalhos()" title="Atalhos de teclado (?)">⌨ teclado</button></span><span style="font-weight:400;font-size:12.5px" id="contRes"></span><input type="checkbox" id="verRes" hidden></div><div id="fios"></div></aside></div>
<button id="abrePasta" title="Mostra no Finder a pasta do .md de origem">Abrir pasta</button><button id="copiaMd" title="Copia o documento inteiro em markdown">Copiar .md</button><div id="bolha">Comentar seleção</div><div id="modal"><div class="cx" id="modalCx"></div></div>
<script>
const SLUG=__SLUG__;let E={},VOLTA=null,CITA=null,ANX=[],D={blocos:[]},C=[],alvo=null,ativo=null,editando=null,vers={};
const $=s=>document.querySelector(s),api=(u,o)=>fetch('/api/'+SLUG+u,o).then(r=>r.json()),post=(u,b)=>api(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
const hora=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function rotulo(u){if(/^https?:\/\/(localhost|127\.0\.0\.1):7743\/([\w-]+)/.test(u)){const sl=u.match(/7743\/([\w-]+)/)[1];return 'documento: '+sl.replace(/-/g,' ')}if(/^https?:/.test(u)){try{const x=new URL(u);const seg=x.pathname.split('/').filter(Boolean).pop()||'';return x.hostname.replace(/^www\./,'')+(seg?' › '+decodeURIComponent(seg).slice(0,28):'')}catch(e){return u.slice(0,30)}}return u.split('/').filter(Boolean).pop()}
function chip(u,lab){const web=/^https?:/.test(u);return '<span class="lk" data-u="'+esc(u)+'" title="'+esc(u)+'\nclique: copiar · Cmd+clique: abrir em nova aba'+'" onclick="copiar(event,this)">'+esc(lab||rotulo(u))+(web?'<a class="abrir" href="'+esc(u)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a>':'')+'</span>'}
const mid=(m,k)=>m.id||String(k);
function achaMsg(cit){const f=C.find(x=>x.id===cit.fio);if(!f)return null;const k=f.msgs.findIndex((m,i)=>mid(m,i)===cit.msg);return k<0?null:{f,m:f.msgs[k]}}
function citaHtml(cit){const a=achaMsg(cit);if(!a)return '';const t=(a.m.texto||(a.m.anexos&&a.m.anexos.length?'[imagem]':'')).replace(/\*\*|`/g,'').replace(/\s+/g,' ');return '<div class="citado" onclick="event.stopPropagation();irMsg(\''+cit.fio+'\',\''+cit.msg+'\')"><b>'+(a.m.de==='dono'?'Você':'Claude')+'</b><span>'+esc(t.slice(0,110))+(t.length>110?'…':'')+'</span></div>'}
function irMsg(fio,msg){ativo=fio;lateral();setTimeout(()=>{const el=document.querySelector('[data-m="'+fio+'|'+msg+'"]');if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('pisca');setTimeout(()=>el.classList.remove('pisca'),1600)}},60)}
function citar(fio,msg){CITA={fio,msg};if(!alvo)ativo=fio;lateral();const ta=alvo?$('#novoTxt'):document.getElementById('r-'+fio);ta&&ta.focus()}
function caixaCita(){return CITA?'<div class="citando">'+citaHtml(CITA)+'<button onclick="event.stopPropagation();CITA=null;lateral()">×</button></div>':''}
function balao(m,c,k){if(m.de==='sistema')return '<div style="align-self:center;font-size:11.5px;color:#8a949c;background:#f3f2ee;border-radius:10px;padding:2px 10px">'+esc(m.texto)+' · '+hora(m.em)+'</div>';const cls=m.de==='dono'?'dono':(m.tipo==='edicao'?'ed':'cl');const quem=m.de==='dono'?'':'<div class="quem">'+(m.tipo==='edicao'?'Claude alterou o texto':'Claude')+'</div>';const im=(m.anexos||[]).map(a=>'<img class="anx" src="'+a.url+'" onclick="event.stopPropagation();window.open(\''+a.url+'\')">').join('');const id=mid(m,k);return '<div class="msg '+cls+'" data-m="'+c.id+'|'+id+'"><button class="btnCitar" title="Responder citando" onclick="event.stopPropagation();citar(\''+c.id+'\',\''+id+'\')">↩</button>'+quem+(m.cita?citaHtml(m.cita):'')+im+(m.texto?'<div class="q">'+linkar(m.texto)+'</div>':'')+'<span class="hora">'+hora(m.em)+'</span></div>'}
function linkar(t){const toks=[];const guarda=h=>'\u0000'+(toks.push(h)-1)+'\u0000';let x=String(t);
 x=x.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,l,u)=>guarda(chip(u,l)));
 x=x.replace(/https?:\/\/[^\s<>"')\]]+[^\s<>"')\].,;:!?]/g,u=>guarda(chip(u)));
 x=x.replace(/(?:~|\/Users\/[\w.-]+)\/[^\s<>"'`]+[^\s<>"'`.,;:!?)]/g,u=>guarda(chip(u)));
 return mdBalao(esc(x)).replace(/\u0000(\d+)\u0000/g,(m,k)=>toks[k])}
// markdown leve nos balões: negrito, itálico, código, título, lista e tabela (o texto já vem escapado)
function mdBalao(h){
 h=h.replace(/((?:^[ \t]*\|.*\|[ \t]*(?:\n|$))+)/gm,blk=>{const rows=blk.trim().split('\n').map(r=>r.trim()).filter(r=>!/^\|[\s:|-]+\|$/.test(r));return '<table class="mt">'+rows.map((r,i)=>'<tr>'+r.slice(1,-1).split('|').map(c=>(i?'<td>':'<th>')+c.trim()+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>'});
 h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*\n]*)\*(?=[\s).,;:!?]|$)/gm,'$1<i>$2</i>');
 h=h.replace(/^#{1,4} +(.+)$/gm,'<b>$1</b>').replace(/^[ \t]*[-*] +/gm,'• ');
 return h}
async function copiar(e,el){e.stopPropagation();e.preventDefault();const u=el.dataset.u;if(e.metaKey||e.ctrlKey||e.button===1){window.open(/^https?:/.test(u)?u:'/ver?p='+encodeURIComponent(u),'_blank');return}try{await navigator.clipboard.writeText(u)}catch(_){const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}el.classList.add('ok');setTimeout(()=>el.classList.remove('ok'),1200)}
document.addEventListener('auxclick',e=>{const el=e.target.closest&&e.target.closest('.lk');if(el&&e.button===1)copiar(e,el)});
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function carregar(){const [d,c,e]=await Promise.all([api('/doc'),api('/comentarios'),api('/escolhas')]);E=e||{};const mud=[];d.blocos.forEach(b=>{if(vers[b.id]&&vers[b.id]!==b.v)mud.push(b.id);vers[b.id]=b.v});D=d;C=c;$('#abrePasta').style.display=d.origem?'block':'none';desenhar(mud)}
function desenhar(mud){if(editando)return;const pos=salvaCaret();const doc=$('#doc');doc.innerHTML='';D.blocos.forEach(b=>{const el=document.createElement('div');el.className='blk';el.dataset.b=b.id;el.dataset.t=b.tipo;el.innerHTML=b.html+'<span contenteditable="false" class="ver'+(b.v>1?' alt':'')+'" title="versão '+b.v+' · '+hora(b.em)+' · '+(b.autor==='dono'?'você':'Claude')+'">v'+b.v+'</span><div class="ferr" contenteditable="false"><button tabindex="-1" data-a="c">Comentar</button><button tabindex="-1" data-a="h">Histórico</button></div>';if(mud.includes(b.id))el.classList.add('novo');doc.appendChild(el)});
 doc.querySelectorAll('.ferr button').forEach(bt=>bt.onclick=e=>{e.stopPropagation();const id=bt.closest('.blk').dataset.b;bt.dataset.a==='c'?novo(id,'',[]):historico(id)});
 doc.querySelectorAll('.blk').forEach(el=>el.ondblclick=()=>editar(el.dataset.b));
 graficos();cartoes();lateral();marcas();restauraCaret(pos)}
function graficos(){document.querySelectorAll('canvas[data-chart]').forEach(cv=>{try{new Chart(cv,JSON.parse(cv.dataset.chart))}catch(e){}});if(window.mermaid){try{mermaid.initialize({startOnLoad:false,theme:'neutral'});mermaid.run({querySelector:'.mermaid'})}catch(e){}}}
function texto(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.ferr,.ver')?2:1});let n,s='';const ns=[];while((n=w.nextNode())){ns.push({n,i:s.length});s+=n.nodeValue}return{s,ns}}

function difPal(a,b){const A=a.split(/(\s+)/),B=b.split(/(\s+)/),n=A.length,m=B.length;if(n*m>400000)return esc(b);const L=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);let i=0,j=0,o='';while(i<n&&j<m){if(A[i]===B[j]){o+=esc(A[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){o+='<del>'+esc(A[i])+'</del>';i++}else{o+='<ins>'+esc(B[j])+'</ins>';j++}}while(i<n)o+='<del>'+esc(A[i++])+'</del>';while(j<m)o+='<ins>'+esc(B[j++])+'</ins>';return o}

function cartoes(){
  // pergunta = h3 (ou h2) seguido, a até 3 blocos, de uma lista de escolhas; o cartão vai do título até a lista
  const els=[...document.querySelectorAll('#doc > .blk')];
  els.forEach((el,i)=>{
    if(el.dataset.t!=='escolha')return;
    let k=i-1;while(k>=0&&i-k<=3&&!/^h[23]$/.test(els[k].dataset.t)&&els[k].dataset.t!=='escolha')k--;
    if(k<0||!/^h[23]$/.test(els[k].dataset.t))k=i;
    const cx=document.createElement('section');cx.className='cartao';
    const resp=!!E[el.dataset.b];if(resp)cx.classList.add('resp');
    cx.innerHTML='<span class="selo" contenteditable="false">'+(resp?'respondida':'marque sua escolha')+'</span>';
    els[k].before(cx);for(let j=k;j<=i;j++)cx.appendChild(els[j]);
    const ins=[...el.querySelectorAll('.escolhas input')];
    const e=E[el.dataset.b];
    ins.forEach((inp,j)=>{inp.checked=e?e.marcados.includes(j):!!inp.dataset.pre;if(inp.type==='radio')inp.name='r-'+el.dataset.b;
      inp.addEventListener('change',()=>marcar(el.dataset.b))});
    el.querySelectorAll('.escolhas .op').forEach(op=>op.addEventListener('mousedown',e=>e.stopPropagation()));
  });
}

// caret no texto: o #doc vira área navegável (setas, Ctrl+Shift+setas seleciona), mas não aceita digitação
function prepararTexto(){
  const d=$('#doc');d.setAttribute('contenteditable','true');d.setAttribute('spellcheck','false');d.setAttribute('tabindex','0');
  ['beforeinput','drop','cut'].forEach(ev=>d.addEventListener(ev,e=>{if(!e.target.closest('textarea'))e.preventDefault()}));
  d.addEventListener('paste',e=>{if(!e.target.closest('textarea'))e.preventDefault()});
}
function blocoDo(n){n=n&&(n.nodeType===3?n.parentElement:n);return n&&n.closest&&n.closest('.blk')}
function noTexto(){const s=getSelection();return s.rangeCount&&$('#doc').contains(s.anchorNode)&&!(document.activeElement&&document.activeElement.matches('textarea,input'))}
function segsDe(r){const segs=[];document.querySelectorAll('.blk').forEach(el=>{if(!r.intersectsNode(el))return;const sub=document.createRange();sub.selectNodeContents(el);if(el.contains(r.startContainer))sub.setStart(r.startContainer,r.startOffset);if(el.contains(r.endContainer))sub.setEnd(r.endContainer,r.endOffset);const frag=sub.cloneContents();frag.querySelectorAll('.ferr,.ver,.escolhas').forEach(x=>x.remove());const tx=frag.textContent.trim();if(tx)segs.push({bloco:el.dataset.b,texto:tx})});return segs}
function fimDe(r){const b=blocoDo(r.endContainer);if(!b)return null;const {s,ns}=texto(b);let off=0;for(const x of ns){if(x.n===r.endContainer){off=x.i+r.endOffset;break}}if(r.endContainer.nodeType!==3)off=s.length;return {b:b.dataset.b,off}}
function caretEm(b,off){const el=document.querySelector('.blk[data-b="'+b+'"]');if(!el)return false;const {ns}=texto(el);let alvoN=null,o=0;for(const x of ns){if(x.n.parentElement.closest('.escolhas'))continue;alvoN=x;o=x.n.nodeValue.length;if(off<=x.i+x.n.nodeValue.length){o=Math.max(0,off-x.i);break}}if(!alvoN)return false;
  $('#doc').focus({preventScroll:true});const r=document.createRange();r.setStart(alvoN.n,o);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);cur(el);el.scrollIntoView({block:'nearest',behavior:'smooth'});return true}
// depois de comentar, o cursor vai para a linha de baixo do trecho (ou o começo do bloco seguinte)
function voltar(){const v=VOLTA;VOLTA=null;if(!v)return;const el=document.querySelector('.blk[data-b="'+v.b+'"]');if(!el)return;
  const {s}=texto(el);if(v.off>=s.trim().length){const prox=proxBloco(el,1);if(prox){caretEm(prox.dataset.b,0);return}}caretEm(v.b,v.off);const sl=getSelection(),r0=sl.getRangeAt(0).getBoundingClientRect();sl.modify('move','forward','line');sl.modify('move','backward','lineboundary');const r1=sl.rangeCount&&sl.getRangeAt(0).getBoundingClientRect();if(!r1||r1.top<=r0.top+2||!el.contains(sl.anchorNode)){const prox=proxBloco(el,1);prox&&caretEm(prox.dataset.b,0)}}

function comentarSelecao(){const s=getSelection();if(!s.rangeCount)return false;const r=s.getRangeAt(0);

function atalhos(){const T=[['Tab / Shift+Tab','próximo / anterior: texto, opções de escolha, comentários'],['↑ ↓ ← →','move o cursor no texto'],['Ctrl+↑ / Ctrl+↓','bloco anterior / seguinte'],['Shift+setas, Ctrl+Shift+setas','seleciona letra ou palavra'],['Tab com seleção','comenta o trecho selecionado'],['Enter no texto','comenta o bloco inteiro'],['Ctrl+Enter','envia o comentário e volta para a linha de baixo'],['Esc','sai do comentário e volta ao texto'],['Espaço','marca a opção (checkbox e liga/desliga)'],['↑ ↓ nas opções','troca a escolha única'],['E','edita o bloco onde está o cursor'],['H','histórico do bloco'],['?','esta lista']];
  $('#modalCx').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Teclado</h3><button class="sec" style="border:0;border-radius:8px;padding:7px 12px;cursor:pointer" onclick="$(\'#modal\').style.display=\'none\'">Fechar</button></div><table class="teclas" style="margin-top:12px">'+T.map(t=>'<tr><td>'+t[0].split(/(\s\/\s|,\s)/).map(k=>/^(\s\/\s|,\s)$/.test(k)?k:'<kbd>'+esc(k)+'</kbd>').join('')+'</td><td>'+t[1]+'</td></tr>').join('')+'</table>';$('#modal').style.display='flex'}
document.addEventListener('keydown',e=>{
  if($('#modal').style.display==='flex'){if(e.key==='Escape'){$('#modal').style.display='none';e.preventDefault()}return}
  const at=document.activeElement;
  if(at&&at.matches('textarea,#edTxt'))return;
  if(at&&at.matches('.escolhas input')){ if(e.key==='Enter'){e.preventDefault();at.click()} return }
  if(at&&at.classList&&at.classList.contains('fio')&&e.key==='Enter'){e.preventDefault();at.click();setTimeout(()=>{const t=document.getElementById('r-'+at.dataset.c);t&&t.focus()},30);return}
  if(!noTexto())return;
  const s=getSelection();const r=s.getRangeAt(0);
  if(e.key==='Tab'&&!e.shiftKey&&!r.collapsed){e.preventDefault();comentarSelecao();return}
  if(e.key==='Enter'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();comentarSelecao();return}
  if(e.ctrlKey&&!e.shiftKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const b=blocoDo(r.startContainer);const p=b&&proxBloco(b,e.key==='ArrowDown'?1:-1);p&&caretEm(p.dataset.b,0);return}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='e'||e.key==='h'||e.key==='?')){e.preventDefault();if(e.key==='?')return atalhos();const b=blocoDo(r.startContainer);if(b)e.key==='e'?editar(b.dataset.b):historico(b.dataset.b);return}
});
