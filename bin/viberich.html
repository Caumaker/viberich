function segmentsOf(r){const segs=[];document.querySelectorAll('.blk').forEach(el=>{if(!r.intersectsNode(el))return;const sub=document.createRange();sub.selectNodeContents(el);if(el.contains(r.startContainer))sub.setStart(r.startContainer,r.startOffset);if(el.contains(r.endContainer))sub.setEnd(r.endContainer,r.endOffset);const frag=sub.cloneContents();frag.querySelectorAll('.tools,.vb').forEach(x=>x.remove());const tx=frag.textContent.trim();if(tx)segs.push({block:el.dataset.b,text:tx})});return segs}
function endOf(r){const b=blockOf(r.endContainer);if(!b)return null;const {s,ns}=textOf(b);let off=0;for(const x of ns){if(x.n===r.endContainer){off=x.i+r.endOffset;break}}if(r.endContainer.nodeType!==3)off=s.length;return {b:b.dataset.b,off}}
function caretAt(b,off){const el=document.querySelector('.blk[data-b="'+b+'"]');if(!el)return false;const {ns}=textOf(el);let node=null,o=0;for(const x of ns){if(x.n.parentElement.closest('.choices'))continue;node=x;o=x.n.nodeValue.length;if(off<=x.i+x.n.nodeValue.length){o=Math.max(0,off-x.i);break}}if(!node)return false;
  $('#doc').focus({preventScroll:true});const r=document.createRange();r.setStart(node.n,o);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);markCurrent(el);el.scrollIntoView({block:'nearest',behavior:'smooth'});return true}
// after a comment, the caret goes to the line below the passage (or to the start of the next block)
function returnCaret(){const v=returnTo;returnTo=null;if(!v)return;const el=document.querySelector('.blk[data-b="'+v.b+'"]');if(!el)return;
  const {s}=textOf(el);if(v.off>=s.trim().length){const next=nextBlock(el,1);if(next){caretAt(next.dataset.b,0);return}}caretAt(v.b,v.off);const sl=getSelection(),r0=sl.getRangeAt(0).getBoundingClientRect();sl.modify('move','forward','line');sl.modify('move','backward','lineboundary');const r1=sl.rangeCount&&sl.getRangeAt(0).getBoundingClientRect();if(!r1||r1.top<=r0.top+2||!el.contains(sl.anchorNode)){const next=nextBlock(el,1);next&&caretAt(next.dataset.b,0)}}
function blockEls(){return [...document.querySelectorAll('#doc .blk')]}
function nextBlock(el,dir){const L=blockEls();const i=L.indexOf(el);return L[i+dir]||null}
function markCurrent(el){document.querySelectorAll('.blk.cur').forEach(x=>x!==el&&x.classList.remove('cur'));el&&el.classList.add('cur')}
function saveCaret(){if(!inText())return null;const r=getSelection().getRangeAt(0);return endOf(r)}
function restoreCaret(p){if(p)caretAt(p.b,p.off)}
function commentSelection(){const s=getSelection();if(!s.rangeCount)return false;const r=s.getRangeAt(0);
  if(r.collapsed){const b=blockOf(r.startContainer);if(!b)return false;returnTo=endOf(r);startComment(b.dataset.b,'',[]);return true}
  const segs=segmentsOf(r);if(!segs.length)return false;returnTo=endOf(r);$('#commentSel').style.display='none';s.removeAllRanges();startComment(segs[0].block,segs.map(x=>x.text).join(' … ').slice(0,1500),segs);return true}
function showShortcuts(){const T=[[['Tab','Shift+Tab'],'next / previous: text, choice options, comments'],[['↑','↓','←','→'],'move the caret in the text'],[['Ctrl+↑','Ctrl+↓'],'previous / next block'],[['Shift+arrows','Ctrl+Shift+arrows'],'select by character / by word'],[['Tab'],'with text selected: comment on the selection'],[['Enter'],'in the text: comment on the whole block'],[['Ctrl+Enter'],'send the comment and put the caret on the next line'],[['Ctrl+Shift+Enter'],'send everything in the queue'],[['Esc'],'leave the comment box and go back to the text'],[['Space'],'tick an option (checkbox and switch)'],[['↑','↓'],'in the options: change a single choice'],[['E'],'edit the block under the caret'],[['H'],'history of the block under the caret'],[['[',']'],'previous / next stage (the tabs at the top)'],[['?'],'this list']];
  $('#modalBox').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Keyboard</h3><button class="sec" style="border:0;border-radius:8px;padding:7px 12px;cursor:pointer" onclick="$(\'#modal\').style.display=\'none\'">Close</button></div><table class="keys" style="margin-top:12px">'+T.map(t=>'<tr><td>'+t[0].map(k=>'<kbd>'+esc(k)+'</kbd>').join(' ')+'</td><td>'+esc(t[1])+'</td></tr>').join('')+'</table>';$('#modal').style.display='flex'}
document.addEventListener('keydown',e=>{
  if($('#modal').style.display==='flex'){if(e.key==='Escape'){$('#modal').style.display='none';e.preventDefault()}return}
  const at=document.activeElement;
  if(at&&at.matches('textarea'))return;
  if(at&&at.matches('.choices input')){ if(e.key==='Enter'){e.preventDefault();at.click()} return }
  if(at&&at.classList&&at.classList.contains('thread')&&e.key==='Enter'){e.preventDefault();at.click();setTimeout(()=>{const t=document.getElementById('r-'+at.dataset.c);t&&t.focus()},30);return}
  if(!inText())return;
  const s=getSelection();const r=s.getRangeAt(0);
  if(e.key==='Tab'&&!e.shiftKey&&!r.collapsed){e.preventDefault();commentSelection();return}
  if(e.key==='Enter'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();commentSelection();return}
  if(e.ctrlKey&&!e.shiftKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const b=blockOf(r.startContainer);const p=b&&nextBlock(b,e.key==='ArrowDown'?1:-1);p&&caretAt(p.dataset.b,0);return}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='e'||e.key==='h'||e.key==='?')){e.preventDefault();if(e.key==='?')return showShortcuts();const b=blockOf(r.startContainer);if(b)e.key==='e'?editBlock(b.dataset.b):showHistory(b.dataset.b);return}
});
// Ctrl+Shift+arrow selects a word on Windows and Linux; on a Mac the native key is Alt+Shift, so accept both there
document.addEventListener('keydown',e=>{if(!inText()||!e.ctrlKey||!e.shiftKey||!/^Arrow(Left|Right)$/.test(e.key)||!/Mac/.test(navigator.platform))return;e.preventDefault();getSelection().modify('extend',e.key==='ArrowLeft'?'backward':'forward','word')},true);
document.addEventListener('selectionchange',()=>{if(inText()){const b=blockOf(getSelection().focusNode);b&&markCurrent(b)}});
prepareText();

// ===== send queue and approve decisions =====
const QUEUE_KEY='viberich-queue-'+SLUG,SEND_NOW_KEY='viberich-send-now';
function readQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch(e){return[]}}
function writeQueue(Q){try{localStorage.setItem(QUEUE_KEY,JSON.stringify(Q))}catch(e){}}
function sendNow(){try{return localStorage.getItem(SEND_NOW_KEY)!=='0'}catch(e){return true}}
async function submit(u,b){if(sendNow())return post(u,b);const Q=readQueue();Q.push({u,b,t:Date.now()});writeQueue(Q);updateBar()}
function unanswered(){return [...document.querySelectorAll('#doc .blk[data-t="choice"]')].filter(el=>!CHOICES[el.dataset.b]&&!readQueue().some(x=>x.u==='/choose'&&x.b.block===el.dataset.b))}
function updateBar(){const Q=readQueue(),n=unanswered().length;const bS=$('#send'),bA=$('#approve');$('#sendNow').checked=sendNow();
  bS.style.display=sendNow()&&!Q.length?'none':'';bS.textContent='Send'+(Q.length?' ('+Q.length+')':'');bS.disabled=!Q.length;
  bA.style.display=document.querySelector('#doc .blk[data-t="choice"]')?'':'none';bA.textContent=n?'Approve decisions ('+n+')':'Decisions answered';bA.disabled=!n;
  const bf=$('#approveEnd');if(bf){bf.parentElement.style.display=n?'':'none';bf.textContent='Approve decisions ('+n+')'}}
function approveAtEnd(){const cs=document.querySelectorAll('#doc .card');if(!cs.length)return;const d=document.createElement('div');d.className='approve-end';d.setAttribute('contenteditable','false');d.innerHTML='<button id="approveEnd"></button>';cs[cs.length-1].after(d);d.querySelector('button').onclick=approveAll}
function checkedOf(el){return [...el.querySelectorAll('.choices input')].map((x,j)=>x.checked?j:-1).filter(j=>j>=0)}
async function approveAll(){const Q=readQueue();unanswered().forEach(el=>Q.push({u:'/choose',b:{block:el.dataset.b,checked:checkedOf(el)},t:Date.now()}));writeQueue(Q);await sendQueue()}
async function sendQueue(){const Q=readQueue();if(!Q.length)return;const bS=$('#send');bS.disabled=true;bS.textContent='Sending...';
  for(const it of Q){await post(it.u,it.b);writeQueue(readQueue().filter(x=>x.t!==it.t||x.u!==it.u))}
  await load();updateBar()}
function unqueue(t){writeQueue(readQueue().filter(x=>String(x.t)!==String(t)));load()}
function queueHtml(){const Q=readQueue().filter(x=>x.u!=='/choose');if(!Q.length)return '';
  return Q.map(x=>{const c=x.u==='/reply'?THREADS.find(k=>k.id===x.b.id):null;const ref=c?(c.selection?'“'+esc(c.selection)+'”':'Whole block'):(x.b.selection?'“'+esc(x.b.selection)+'”':'Whole block');
    return '<div class="thread queued"><button title="Remove from the queue" onclick="event.stopPropagation();unqueue(\''+x.t+'\')">×</button><div class="tag">QUEUED · '+(c?'reply':'new comment')+'</div><div class="ref">'+ref+'</div><div class="convo"><div class="msg user"><div class="q">'+linkify(x.b.text||'[image]')+'</div></div></div></div>'}).join('')}
$('#sendNow').onchange=e=>{try{localStorage.setItem(SEND_NOW_KEY,e.target.checked?'1':'0')}catch(_){};if(e.target.checked&&readQueue().length)sendQueue();updateBar()};
$('#send').onclick=sendQueue;$('#approve').onclick=approveAll;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&e.shiftKey){e.preventDefault();sendQueue()}},true);

// ===== stages as tabs: every new round from Claude is a tab; what is still open in earlier stages shows up again =====
const TAB_KEY='viberich-tab-'+SLUG,NSTAGES_KEY='viberich-nstages-'+SLUG,SEEN_KEY='viberich-seen-'+SLUG;let TAB=0;try{TAB=Number(localStorage.getItem(TAB_KEY)||0)}catch(e){}
function nStages(){return (DOC.stages||[]).length}
// the first visit, and every new stage, opens the newest tab
function checkTabs(){let before=-1;try{before=Number(localStorage.getItem(NSTAGES_KEY)??-1)}catch(e){}const n=nStages();
  if(n>before)TAB=n;if(TAB>n)TAB=n;try{localStorage.setItem(NSTAGES_KEY,String(n));localStorage.setItem(TAB_KEY,String(TAB))}catch(e){}}
function goToTab(i){TAB=i;try{localStorage.setItem(TAB_KEY,String(i))}catch(e){};draw([]);scrollTo({top:0,behavior:'smooth'})}
function isQueued(id){return readQueue().some(x=>x.u==='/choose'&&x.b.block===id)}
function openChoicesOf(r){return DOC.blocks.filter(b=>b.r===r&&b.type==='choice'&&!CHOICES[b.id]&&!isQueued(b.id))}
// threads whose last message is from Claude: the user owes an answer
function threadsWaitingFor(r){return THREADS.filter(c=>{if(c.resolved)return false;const b=DOC.blocks.find(x=>x.id===c.block);if(!b||b.r!==r)return false;const u=c.messages.filter(m=>m.author!=='system').at(-1);return u&&u.author!=='user'})}
// a choice list together with its heading (and whatever sits between them), so the card is complete
function withHeading(b){const L=DOC.blocks.filter(x=>x.r===b.r);const k=L.indexOf(b);const out=[b];for(let i=k-1;i>=0&&k-i<=3;i--){if(L[i].type==='choice')break;out.unshift(L[i]);if(/^h[23]$/.test(L[i].type))return out}return [b]}
function visibleBlocks(){const list=[];let open=null;
  if(nStages()){const carried=[];for(let r=0;r<TAB;r++)openChoicesOf(r).forEach(b=>carried.push(...withHeading(b)));
    const waiting=[];for(let r=0;r<TAB;r++)waiting.push(...threadsWaitingFor(r));
    if(carried.length||waiting.length){open=document.createElement('div');open.className='open-earlier';open.setAttribute('contenteditable','false');
      const nq=carried.filter(b=>b.type==='choice').length;
      open.innerHTML='<b>Open from earlier stages</b>'+(nq?'<div>'+nq+' unanswered decision'+(nq===1?'':'s')+', right below.</div>':'')+waiting.map(c=>'<a data-c="'+c.id+'">'+esc((c.selection||'whole block').slice(0,90))+': Claude\'s answer is waiting for you</a>').join('');
      open.querySelectorAll('a').forEach(a=>a.onclick=()=>{const c=THREADS.find(x=>x.id===a.dataset.c);active=c.id;focusBlock(c.block);sidebar()})}
    list.push(...carried)}
  list.push(...DOC.blocks.filter(b=>(b.r||0)===TAB));return {list,open}}
function drawTabs(){const el=$('#tabs');const n=nStages();if(!n){el.style.display='none';return}el.style.display='';
  const names=[DOC.title,...DOC.stages.map(st=>st.title)];let seen=-1;try{seen=Number(localStorage.getItem(SEEN_KEY)??-1)}catch(e){}
  el.innerHTML=names.map((t,i)=>{const k=openChoicesOf(i).length+threadsWaitingFor(i).length;return '<button class="tab'+(i===TAB?' on':'')+(i===n&&seen<n?' new':'')+'" data-i="'+i+'" title="'+esc(t)+'"><span class="t">'+(i+1)+'. '+esc(t)+'</span>'+(k?'<span class="n">'+k+'</span>':'')+'</button>'}).join('');
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>goToTab(Number(b.dataset.i)));
  if(TAB===n)try{localStorage.setItem(SEEN_KEY,String(n))}catch(e){}
  document.querySelectorAll('.blk[data-from]').forEach(x=>{const h=x.querySelector('h2,h3');if(h&&!h.querySelector('.from-stage'))h.insertAdjacentHTML('beforeend','<span class="from-stage" contenteditable="false">from stage '+(Number(x.dataset.from)+1)+'</span>')})}
document.addEventListener('keydown',e=>{if(!nStages()||e.ctrlKey||e.metaKey||e.altKey)return;const a=document.activeElement;if(a&&a.matches('textarea,input'))return;if(e.key==='['&&TAB>0){e.preventDefault();goToTab(TAB-1)}else if(e.key===']'&&TAB<nStages()){e.preventDefault();goToTab(TAB+1)}});

load().then(()=>{const R=readDrafts();if(R.__target&&R.newText){target=R.__target;sidebar()}connect()});
</script></body></html>
